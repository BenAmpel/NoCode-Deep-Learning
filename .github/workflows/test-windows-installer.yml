name: Windows Installer

on:
  push:
    branches: [main]
  pull_request:  # every base branch, so stacked PRs get CI too
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          $candidatePaths = @(
            "C:\Program Files (x86)\Inno Setup 6",
            "C:\Program Files\Inno Setup 6"
          )
          foreach ($path in $candidatePaths) {
            if (Test-Path $path) {
              $path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
          $iscc = Get-Command iscc.exe -ErrorAction Stop
          Write-Host "Using ISCC at $($iscc.Source)"

      - name: Build Windows installer
        run: python packaging/build_windows_installer.py --version 1.0.0-ci

      - name: Show installer size
        run: |
          $installer = Get-ChildItem "dist/Output/NoCode-DL-Setup-*.exe" -ErrorAction Stop | Select-Object -First 1
          Write-Host "Installer: $($installer.FullName)"
          Write-Host ("Size: {0:N2} MB" -f ($installer.Length / 1MB))

      - name: Run installer silently
        run: |
          $installer = Get-ChildItem "dist/Output/NoCode-DL-Setup-*.exe" -ErrorAction Stop | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -NoNewWindow

      - name: Verify installed files
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "NoCode-DL"
          Write-Host "Checking install directory: $installDir"
          if (-not (Test-Path $installDir)) {
            throw "Install directory not found: $installDir"
          }

          $requiredFiles = @(
            "NoCode-DL.bat",
            "NoCode-DL.ps1",
            "runtime\bootstrap_windows.py",
            ".bundle_version",
            "install.py",
            "run_local.py",
            "runtime\runtime_setup.py",
            "requirements.txt"
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $installDir $file
            if (-not (Test-Path $path)) {
              throw "Missing installed file: $path"
            }
            Write-Host "OK $file"
          }

          Get-Content (Join-Path $installDir ".bundle_version")

      - name: Smoke-test Python modules from install
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "NoCode-DL"
          python -c "import sys; from pathlib import Path; install_dir = Path(r'$installDir'); sys.path.insert(0, str(install_dir / 'runtime')); from runtime_setup import install_is_current; print('runtime_setup imported OK'); ok, reason = install_is_current(install_dir / '.venv'); print(f'install_is_current on fresh install: ok={ok}, reason={reason}'); assert not ok; version = (install_dir / '.bundle_version').read_text().strip(); print(f'Bundle version: {version}'); assert version"

      - name: First launch from the Start menu shortcut (smoke mode)
        # The real first run: hidden PowerShell -> Python -> progress window ->
        # ~2 GB dependency install -> app start -> HTTP check -> exit 0.
        timeout-minutes: 60
        env:
          NOCODE_DL_SMOKE_TEST: "1"
        run: |
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "NoCode-DL.lnk" |
            Select-Object -First 1
          if (-not $lnk) { throw "Start menu shortcut not found" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName)
          Write-Host "Shortcut: $($shortcut.TargetPath) $($shortcut.Arguments)"

          $shots = Join-Path $env:RUNNER_TEMP "first-run"
          New-Item -ItemType Directory -Force $shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen([string]$path) {
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "screenshot failed: $_" }
          }

          $proc = Start-Process -FilePath $shortcut.TargetPath -ArgumentList $shortcut.Arguments `
            -WorkingDirectory $shortcut.WorkingDirectory -WindowStyle Minimized -PassThru
          $null = $proc.Handle  # keep the handle so ExitCode is available afterwards
          $tick = 0
          while (-not $proc.HasExited) {
            if ($tick -in @(2, 6, 18, 36) -or ($tick -gt 0 -and $tick % 60 -eq 0)) {
              Save-Screen (Join-Path $shots ("screen-{0:D4}s.png" -f ($tick * 5)))
            }
            Start-Sleep -Seconds 5
            $tick++
          }
          $proc.WaitForExit()
          $code = $proc.ExitCode
          Write-Host "Launcher exit code: $code after $($tick * 5)s"

          $logs = Join-Path $env:LOCALAPPDATA "NoCode-DL\logs"
          Copy-Item "$logs\*" $shots -ErrorAction SilentlyContinue
          Write-Host "===== launcher.log ====="; Get-Content "$logs\launcher.log" -ErrorAction SilentlyContinue
          Write-Host "===== server.log ====="; Get-Content "$logs\server.log" -ErrorAction SilentlyContinue

          if ($code -ne 0) { throw "First launch exited with code $code" }
          $launcher = Get-Content "$logs\launcher.log" -Raw
          $server = Get-Content "$logs\server.log" -Raw
          if ($launcher -notmatch "progress window shown") { throw "The progress window was not shown" }
          if ($launcher -notmatch "Successfully installed") { throw "pip output did not reach launcher.log" }
          if ($server -notmatch "answered HTTP 200") { throw "The app did not answer HTTP" }
          if ($server -notmatch "Launch and shutdown succeeded") { throw "The smoke test did not finish" }

      - name: Second launch from NoCode-DL.bat (no reinstall, exit code passed through)
        timeout-minutes: 15
        env:
          NOCODE_DL_SMOKE_TEST: "1"
        run: |
          $bat = Join-Path $env:LOCALAPPDATA "NoCode-DL\NoCode-DL.bat"
          cmd /c "`"$bat`""
          $code = $LASTEXITCODE
          Write-Host "NoCode-DL.bat exit code: $code"
          if ($code -ne 0) { throw "Second launch exited with code $code" }
          $tail = Get-Content (Join-Path $env:LOCALAPPDATA "NoCode-DL\logs\launcher.log") -Tail 60
          $tail
          if (($tail -join "`n") -match "Installing dependencies") { throw "The second launch reinstalled dependencies" }

      - name: Upload first-launch screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-first-launch
          path: ${{ runner.temp }}/first-run
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoCode-DL-Setup-windows
          path: dist/Output/NoCode-DL-Setup-*.exe
          retention-days: 30
