name: Security Scan

on:
  push:
    branches: [main]
  pull_request:  # every base branch, so stacked PRs get CI too
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BANDIT_PATHS: >-
    app.py config.py install.py run_local.py runtime
    data_pipeline detection eval export modalities models
    packaging pipeline scripts training ui

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit

      # Fails the job on any known vulnerability in the pinned dependencies or
      # anything they pull in. `shell: bash` adds pipefail, so `tee` can't hide
      # the exit code.
      - name: Dependency vulnerability audit
        id: pip_audit
        shell: bash
        run: |
          pip-audit -r requirements.txt | tee pip-audit.txt

      # The static scans still run (and still report) if the audit failed.
      # Medium-severity findings are written to the report; high severity fails the job.
      - name: Static security scan (report, medium and above)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bandit -q -r $BANDIT_PATHS -ll -f txt -o bandit.txt --exit-zero
          cat bandit.txt

      - name: Static security scan (gate, high severity)
        id: bandit
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bandit -q -r $BANDIT_PATHS -lll

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Security scan summary"
            echo
            echo "- Dependency audit status: ${{ steps.pip_audit.outcome }}"
            echo "- Static scan status: ${{ steps.bandit.outcome }}"
            echo
            echo "### Dependency audit"
            echo '```text'
            if [ -f pip-audit.txt ]; then cat pip-audit.txt; else echo "No pip-audit output captured."; fi
            echo '```'
            echo
            echo "### Static scan"
            echo '```text'
            if [ -f bandit.txt ]; then cat bandit.txt; else echo "No bandit output captured."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            pip-audit.txt
            bandit.txt
          retention-days: 14
